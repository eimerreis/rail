  <p class="footnote">Design prototypes with sample tabs and article content. No real websites are loaded. Unloaded tabs retain their title and URL; reopening reloads the page. Shared browser memory and tab metadata remain.</p>

<script>
const paths={sidebar:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',chevron:'<path d="m9 6 6 6-6 6"/>',down:'<path d="m7 10 5 5 5-5"/>',back:'<path d="m14 6-6 6 6 6"/>',forward:'<path d="m10 6 6 6-6 6"/>',reload:'<path d="M19 7v5h-5"/><path d="M19 12a7 7 0 1 0-2 5M19 7v5"/>',lock:'<rect x="6" y="10" width="12" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',work:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M3 12h18M10 12v3h4v-3"/>',home:'<path d="m3 11 9-8 9 8M5 10v10h14V10M10 20v-7h4v7"/>',leaf:'<path d="M20 3c-11 0-17 5-14 12 6 6 14-2 14-12ZM4 21 15 10"/>',moon:'<path d="M20.5 14.2A9 9 0 0 1 9.8 3.5 9 9 0 1 0 20.5 14.2Z"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="17" r="2" fill="currentColor"/>',pin:'<path d="m9 3 6 0-1 6 4 4H6l4-4-1-6ZM12 13v8"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',github:'<path d="M8 20v-4c-4 1-4-2-5-2m13 6v-4c0-2 1-2 2-3 2-2 1-6 0-7V3l-4 2H9L6 3v3c-2 2-2 5 0 7 1 1 2 1 2 3"/>',figma:'<rect x="5" y="3" width="7" height="6" rx="3"/><rect x="12" y="3" width="7" height="6" rx="3"/><rect x="5" y="9" width="7" height="6" rx="3"/><circle cx="15.5" cy="12" r="3"/><path d="M12 15v3a3.5 3.5 0 1 1-7 0v-3Z"/>',linear:'<circle cx="12" cy="12" r="9"/><path d="m6 6 12 12M4 10l10 10M10 4l10 10"/>',book:'<path d="M3 4h6a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H3ZM21 4h-6a3 3 0 0 0-3 3v14a3 3 0 0 1 3-3h6Z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h6"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',globe:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>',check:'<path d="m5 12 4 4L19 6"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',share:'<path d="M12 15V3m-4 4 4-4 4 4M7 10H4v11h16V10h-3"/>',rail:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M12 3v18"/>',focus:'<rect x="3" y="3" width="18" height="18" rx="2"/><rect x="5" y="8" width="7" height="11" rx="1"/>',stack:'<path d="m3 7 9-4 9 4-9 4ZM3 12l9 4 9-4M3 17l9 4 9-4"/>',file:'<path d="M14 3H5v18h14V8ZM14 3v5h5M8 12h8M8 16h5"/>'};
const icon=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.globe}</svg>`;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const directions={native:{name:'Native',icon:'sidebar',description:'<strong>A familiar place to browse.</strong> A spacious, integrated sidebar with everything where you expect it.',notes:[['Always within reach','Pinned tabs stay at the top. Spaces live at the bottom.'],['One tab, one identity','A small W, P, or I marks its session. Change it in the toolbar.'],['Room for the page','⌘ S hides the sidebar and lets the page expand.']]},rail:{name:'Rail · Light',icon:'rail',description:'<strong>Built for switching contexts.</strong> A compact light sidebar with a dedicated rail for Spaces.',notes:[['Spaces at a glance','The separate rail keeps Work, Personal, and Research one click away.'],['Pins become shortcuts','A small shelf of pinned sites leaves more room for open tabs.'],['Clear tab states','Session markers and moon icons keep identity and sleep visible.']]},focus:{name:'Focus',icon:'focus',description:'<strong>The page stays still.</strong> A floating sidebar appears only when you need to navigate.',notes:[['A sidebar that floats','⌘ S moves the drawer away without shifting the page underneath.'],['A lighter workspace','Switch Spaces at the top. Pins stay part of the familiar tab list.'],['Details on demand','Session selection and idle settings open in small popovers.']]}};
const spaces=[{id:'work',name:'Work',icon:'work',desc:'A little room for good work.'},{id:'personal',name:'Personal',icon:'home',desc:'For everything outside work.'},{id:'research',name:'Research',icon:'book',desc:'Follow a thought a little further.'}];
const initialTabs=[
{id:1,title:'GitHub',url:'github.com',icon:'github',space:'work',session:'work',pinned:true,sleep:false},
{id:2,title:'Figma',url:'figma.com',icon:'figma',space:'work',session:'work',pinned:true,sleep:false},
{id:3,title:'Linear',url:'linear.app',icon:'linear',space:'work',session:'work',pinned:true,sleep:false},
{id:4,title:'Good tools leave room',url:'fieldnotes.design/journal/good-tools',icon:'book',space:'work',session:'personal',pinned:false,sleep:false,article:true},
{id:5,title:'AppKit documentation',url:'developer.apple.com/documentation/appkit',icon:'file',space:'work',session:'work',pinned:false,sleep:false},
{id:6,title:'Weekend in Copenhagen',url:'visitcopenhagen.com',icon:'globe',space:'work',session:'personal',pinned:false,sleep:true},
{id:7,title:'Account settings',url:'example.com/account',icon:'user',space:'work',session:'isolated',pinned:false,sleep:true},
{id:8,title:'CSS layout notes',url:'web.dev/learn/css',icon:'file',space:'work',session:'work',pinned:false,sleep:true},
{id:9,title:'Mail',url:'mail.google.com',icon:'mail',space:'personal',session:'personal',pinned:true,sleep:false},
{id:10,title:'Calendar',url:'calendar.google.com',icon:'calendar',space:'personal',session:'personal',pinned:true,sleep:false},
{id:11,title:'Good tools leave room',url:'fieldnotes.design/journal/good-tools',icon:'book',space:'personal',session:'personal',pinned:false,sleep:false,article:true},
{id:12,title:'A weekend reading list',url:'fieldnotes.design/reading',icon:'book',space:'personal',session:'personal',pinned:false,sleep:true},
{id:13,title:'Chromium Embedded Framework',url:'chromiumembedded.github.io/cef',icon:'globe',space:'research',session:'work',pinned:true,sleep:false},
{id:14,title:'Good tools leave room',url:'fieldnotes.design/journal/good-tools',icon:'book',space:'research',session:'isolated',pinned:false,sleep:false,article:true},
{id:15,title:'The browser process model',url:'chromium.org/developers',icon:'file',space:'research',session:'work',pinned:false,sleep:true}];
let tabs=structuredClone(initialTabs),variant=new URLSearchParams(location.search).get('concept')||'rail',space='work',activeId=4,sidebarVisible=true,timeoutMinutes=10,lastActive={work:4,personal:11,research:14},toastTimer,loadTimer;
if(!directions[variant])variant='rail';
const app=document.querySelector('.app');
const sessionName=s=>s==='isolated'?'Isolated':s==='personal'?'Personal':'Work';
const current=()=>tabs.find(t=>t.id===activeId);
const lights=()=>'<div class="traffic" aria-label="macOS window controls, visual only"><span></span><span></span><span></span></div>';
const iconButton=(name,action,label,extra='')=>`<button class="icon-button ${extra}" data-action="${action}" title="${label}" aria-label="${label}">${icon(name)}</button>`;
function spaceButtons(cls=''){return spaces.map(s=>`<button class="space-choice ${space===s.id?'current':''} ${cls}" data-space="${s.id}" title="${s.name} Space" aria-label="${s.name} Space" aria-pressed="${space===s.id}">${icon(s.icon)}<span>${s.name}</span></button>`).join('')}
function tabRow(t){return `<div class="tab-row ${t.id===activeId?'selected':''} ${t.sleep?'sleeping':''}"><button class="tab-open" data-tab="${t.id}" aria-label="${esc(t.title)}, ${sessionName(t.session)} session${t.sleep?', unloaded; reload on open':''}" ${t.id===activeId?'aria-current="page"':''}><span class="favicon ${t.icon}">${icon(t.icon)}</span><span class="tab-title">${esc(t.title)}</span></button><button class="pin-toggle" data-pin="${t.id}" title="${t.pinned?'Unpin':'Pin'} ${esc(t.title)}" aria-label="${t.pinned?'Unpin':'Pin'} ${esc(t.title)}">${icon('pin')}</button>${t.sleep?`<span class="sleep-icon" title="Unloaded · reloads on open">${icon('moon')}</span>`:''}<button class="session-marker ${t.session}" data-session-for="${t.id}" aria-label="Change ${esc(t.title)} session, currently ${sessionName(t.session)}" title="${sessionName(t.session)} session">${t.session[0].toUpperCase()}</button></div>`}
function articleHTML(){return `<div class="site-header"><div class="site-logo">${icon('leaf')} Fieldnotes</div><div class="site-nav"><span>Journal</span><span>Objects</span><span>About</span></div></div><article class="article"><h1>Good tools leave room for thought.</h1><p class="intro">The things we use every day shape the way we move through the world. The best ones know when to get out of the way.</p><div class="byline"><span class="author-mark">EL</span><span>Emil Lind</span><span class="separator"></span><span>6 min read</span></div><div class="article-visual"><blockquote>Less to manage.<br>More to notice.<span>A note on everyday attention</span></blockquote></div><h2>A little less, a little better.</h2><p class="body-copy">There is a particular pleasure in an object that does exactly what you need. A notebook that opens flat. A chair that lets you forget you are sitting. A window that makes space for the view.</p><div class="article-rule"></div><p class="body-copy">Perhaps the most useful question is not what else a tool can do, but how much room it leaves for what matters.</p></article>`}
function pageHTML(t){if(t.article)return articleHTML();if(t.url==='about:blank')return `<div class="empty-tab">${icon('search')}<h1>A little room for something new.</h1><p>This is a design preview.<br>Use the + button to add another sample tab.</p></div>`;return `<div class="site-header"><div class="site-logo">${icon(t.icon)} ${esc(t.title)}</div><span>Sample page</span></div><div class="mini-content"><h1>${esc(t.title)}</h1><p>This tab is using the <strong>${sessionName(t.session)}</strong> session${t.session==='isolated'?', separate from every other tab':''}.</p>${(t.icon==='github'?['Refine the desktop sidebar','Keep tab state between launches','Review navigation shortcuts']:t.icon==='linear'?['Shape the next iteration','Explore the details','Make room for focused work']:['Overview','Recent activity','Saved for later']).map((r,i)=>`<div class="mini-row">${icon(i===1?'check':'file')}<span>${r}</span><span class="mini-status">${i===1?'Done':'Open'}</span></div>`).join('')}<p style="margin-top:32px">Illustrative content for this browser mockup.</p></div>`}
function render(){
 const t=current(),s=spaces.find(s=>s.id===space),visible=tabs.filter(t=>t.space===space),pins=visible.filter(t=>t.pinned),open=visible.filter(t=>!t.pinned),sleepCount=visible.filter(t=>t.sleep).length;
 document.querySelector('.direction-tabs').innerHTML=Object.entries(directions).map(([id,d])=>`<button class="direction-tab" role="tab" aria-selected="${id===variant}" data-concept="${id}">${icon(d.icon)}${d.name}</button>`).join('');
 document.querySelector('#direction-description').innerHTML=directions[variant].description;
 document.querySelector('#notes').innerHTML=directions[variant].notes.map(([title,copy])=>`<div class="note"><b>${title}</b><p>${copy}</p></div>`).join('');
 app.dataset.variant=variant;app.classList.toggle('sidebar-hidden',!sidebarVisible);
 app.setAttribute('aria-label',`${directions[variant].name} macOS browser mockup`);
 app.innerHTML=`<nav class="rail" aria-label="Spaces"><div class="rail-logo">${icon('stack')}</div>${spaces.map(s=>`<button class="space-choice ${space===s.id?'current':''}" data-space="${s.id}" aria-label="${s.name} Space" title="${s.name} Space" aria-pressed="${space===s.id}">${icon(s.icon)}</button>`).join('')}<div class="rail-bottom">${iconButton('settings','settings','Idle tab settings')}<span class="space-abbreviation">MF</span></div></nav>
 <aside class="sidebar" aria-label="Tabs and Spaces" ${!sidebarVisible?'inert':''}><div class="sidebar-inner"><div class="sidebar-top">${lights()}${iconButton('sidebar','sidebar','Hide sidebar (Command-S)')}</div><div class="focus-space-switcher">${spaceButtons()}</div><div class="space-heading"><span class="space-mark">${icon(s.icon)}</span>${s.name}${iconButton(variant==='focus'?'sidebar':'dots',variant==='focus'?'sidebar':'settings',variant==='focus'?'Hide sidebar (Command-S)':'Space and idle settings')}</div><div class="space-description">${s.desc}</div><div class="tab-scroller"><div class="section-label"><span>${icon('pin')}Pinned</span><span>${pins.length}</span></div><div class="pinned-standard tab-list">${pins.map(tabRow).join('')||'<div class="popover-description">Pin a tab to keep it here.</div>'}</div><div class="pinned-grid">${pins.map(t=>`<button class="pinned-tile ${t.id===activeId?'selected':''} ${t.sleep?'sleeping':''}" data-tab="${t.id}" title="${esc(t.title)} · ${sessionName(t.session)} session${t.sleep?' · Unloaded':''}" ${t.id===activeId?'aria-current="page"':''}><span class="favicon ${t.icon}">${icon(t.icon)}</span>${esc(t.title)}${t.sleep?`<span class="sleep-icon">${icon('moon')}</span>`:''}</button>`).join('')}</div><div class="section-label"><span>Tabs</span><span>${open.length}</span></div><div class="tab-list">${open.map(tabRow).join('')}</div><button class="new-tab" data-action="newtab">${icon('plus')}New tab<kbd>⌘ T</kbd></button></div><div class="sidebar-bottom"><nav class="space-switcher" aria-label="Spaces">${spaceButtons()}</nav><div class="sleep-summary">${icon('moon')}<span>${sleepCount} asleep · after ${timeoutMinutes} min</span>${iconButton('settings','settings','Idle tab settings')}</div></div></div></aside>
 <div class="content-area"><header class="toolbar">${lights()}${iconButton('sidebar','sidebar','Toggle sidebar (Command-S)','reopen-sidebar')}<div class="navigation-buttons"><button class="icon-button" disabled aria-label="Back unavailable in this mockup">${icon('back')}</button><button class="icon-button" disabled aria-label="Forward unavailable in this mockup">${icon('forward')}</button>${iconButton('reload','reload','Reload tab')}</div><div class="url-field" title="${esc(t.url)}">${icon('lock')}<span class="url-text">${esc(t.url==='about:blank'?'New tab':t.url.replace(/\/.*/,''))}</span></div><button class="session-button" data-action="session" aria-label="Change current tab session: ${sessionName(t.session)}" aria-expanded="false"><span class="session-dot ${t.session}"></span><span class="session-text">${sessionName(t.session)}</span>${icon('down')}</button></header><div class="loading-bar" hidden></div><div class="webpage" tabindex="0" aria-label="Sample webpage">${pageHTML(t)}</div><div class="statusbar"><span>${icon('lock')} ${t.session==='isolated'?'Session only for this tab':sessionName(t.session)+' session'}</span><span>${icon('moon')} Idle tabs unload after ${timeoutMinutes} min</span></div></div>
 <div class="popover session-popover" role="menu" aria-label="Choose session for this tab" hidden><div class="popover-heading">Session for this tab</div><p class="popover-description">Choose which logins this tab uses.</p>${['work','personal','isolated'].map(sess=>`<button class="session-option" role="menuitemradio" aria-checked="${t.session===sess}" data-choose-session="${sess}"><span class="option-icon">${icon(sess==='work'?'work':sess==='personal'?'user':'shield')}</span><span class="option-text">${sessionName(sess)}<small>${sess==='isolated'?'Separate logins, only for this tab':'Shared with your '+sessionName(sess).toLowerCase()+' tabs'}</small></span>${icon('check','option-check')}</button>`).join('')}<div class="popover-divider"></div><div class="popover-foot">Changing sessions reloads this tab.<br>Your Space stays the same.</div></div>
 <section class="popover settings-popover" aria-label="Idle tab settings" hidden><div class="settings-head"><h2>Give idle tabs a rest</h2>${iconButton('close','close-popovers','Close settings')}</div><p class="popover-description">Keep the tab. Let the page go.</p><label class="setting-row" for="idle-timeout">Unload tabs after<select id="idle-timeout">${[1,5,10,15,30,60].map(n=>`<option value="${n}" ${n===timeoutMinutes?'selected':''}>${n} minute${n===1?'':'s'}</option>`).join('')}</select></label><p class="setting-note">Inactive pages close after this interval. Their tabs stay in the sidebar and reload when opened. Pinned tabs follow the same rule.</p><div class="popover-divider"></div><p class="setting-note" style="padding-top:8px">The tab you're viewing stays awake. Unsaved page changes may be lost when a tab unloads.</p><div class="setting-actions"><button class="small-action" data-action="sleep">Preview unloading</button><button class="small-action" data-action="wake">Wake all tabs</button></div></section>
 <section class="popover newtab-popover" aria-label="Add a sample tab" hidden><div class="popover-heading">A new tab in ${s.name}</div><form class="newtab-form"><label for="tab-name">Name this sample tab</label><input id="tab-name" name="tab-name" placeholder="Something worth exploring" maxlength="80" required autocomplete="off"><button type="submit">Add tab</button></form></section><div class="toast" role="status" hidden></div>`;
}
function closePopovers(){app.querySelectorAll('.popover').forEach(p=>p.hidden=true);app.querySelector('.session-button')?.setAttribute('aria-expanded','false')}
function popover(name){const p=app.querySelector('.'+name+'-popover');const wasOpen=!p.hidden;closePopovers();p.hidden=wasOpen;if(!wasOpen){if(name==='session')app.querySelector('.session-button').setAttribute('aria-expanded','true');p.querySelector('input,select,button')?.focus()}}
function toast(message){clearTimeout(toastTimer);const el=app.querySelector('.toast');el.textContent=message;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,2800)}
function reload(message){clearTimeout(loadTimer);const bar=app.querySelector('.loading-bar');bar.hidden=false;loadTimer=setTimeout(()=>{bar.hidden=true;if(message)toast(message)},650)}
function openTab(id){const t=tabs.find(t=>t.id===id);if(!t)return;const wasAsleep=t.sleep;t.sleep=false;t.lastUsed=Date.now();activeId=id;lastActive[space]=id;render();if(wasAsleep)reload('Tab reloaded from its saved address.');}
function unload(){const eligible=tabs.filter(t=>t.id!==activeId);eligible.forEach(t=>t.sleep=true);render();toast('Idle tabs unloaded. Their titles and URLs stay.');}
function action(name){if(name==='sidebar'){sidebarVisible=!sidebarVisible;closePopovers();app.classList.toggle('sidebar-hidden',!sidebarVisible);app.querySelector('.sidebar').inert=!sidebarVisible;if(!sidebarVisible)app.querySelector('.reopen-sidebar')?.focus();return}if(name==='session'||name==='settings'||name==='newtab'){popover(name);return}if(name==='close-popovers'){closePopovers();return}if(name==='sleep'){unload();return}if(name==='wake'){tabs.forEach(t=>t.sleep=false);render();toast('All tabs are awake.');return}if(name==='reload'){reload('Tab reloaded in the '+sessionName(current().session)+' session.');return}if(name==='reset'){tabs=structuredClone(initialTabs);space='work';activeId=4;lastActive={work:4,personal:11,research:14};timeoutMinutes=10;sidebarVisible=true;render();return}}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn){if(!e.target.closest('.popover'))closePopovers();return}if(btn.dataset.concept){variant=btn.dataset.concept;sidebarVisible=true;render();return}if(btn.dataset.space){space=btn.dataset.space;activeId=lastActive[space]||tabs.find(t=>t.space===space).id;current().sleep=false;render();return}if(btn.dataset.tab){openTab(+btn.dataset.tab);return}if(btn.dataset.pin){const t=tabs.find(t=>t.id===+btn.dataset.pin);t.pinned=!t.pinned;render();toast(t.pinned?'Tab pinned. It can still unload when idle.':'Tab unpinned.');return}if(btn.dataset.sessionFor){openTab(+btn.dataset.sessionFor);popover('session');return}if(btn.dataset.chooseSession){const next=btn.dataset.chooseSession;current().session=next;render();reload(next==='isolated'?'This tab now has its own isolated session.':'Tab switched to the '+sessionName(next)+' session.');return}const act=btn.dataset.action||btn.dataset.demo;if(act){action(act);return}if(!e.target.closest('.popover'))closePopovers()});
document.addEventListener('change',e=>{if(e.target.id==='idle-timeout'){timeoutMinutes=Number(e.target.value);render();popover('settings');toast('Idle timeout set to '+timeoutMinutes+' minutes.')}});
document.addEventListener('submit',e=>{if(e.target.matches('.newtab-form')){e.preventDefault();const value=new FormData(e.target).get('tab-name').trim();if(!value)return;const t={id:Date.now(),title:value,url:'about:blank',icon:'globe',space,session:space==='personal'?'personal':'work',sleep:false,pinned:false,lastUsed:Date.now()};tabs.push(t);activeId=t.id;lastActive[space]=t.id;render();toast('Sample tab added.');}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();action('sidebar')}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='t'){e.preventDefault();action('newtab')}if(e.key==='Escape')closePopovers();if(e.target.matches('.direction-tab')&&['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();const ids=Object.keys(directions),i=ids.indexOf(variant);variant=ids[(i+(e.key==='ArrowRight'?1:2))%3];sidebarVisible=true;render();document.querySelector(`[data-concept="${variant}"]`).focus()}});
render();
</script>
